---
kind: pipeline
type: docker
name: amd64

platform:
  os: linux
  arch: amd64

steps:
- name: prepare workspace
  image: alpine
  commands:
  - rm -fr build_dir
- name: build hermes
  image: alpine
  commands:
  - apk add -t hermes-build-deps --no-cache graphviz doxygen gcc make openssl-dev libspf2-dev cmake g++ sqlite-dev gettext-dev python3
  - cmake -B build_dir -D BUILD_DOCS=ON
  - cmake --build build_dir
- name: docker image build
  image: plugins/docker
  settings:
    tags:
      - latest
    repo: docker.gutierrezdequevedo.com/ps/hermes
---
kind: pipeline
type: docker
name: arm64

platform:
  os: linux
  arch: arm64

steps:
- name: prepare workspace
  image: alpine
  commands:
  - rm -fr build_dir
- name: build hermes
  image: alpine
  commands:
  - apk add -t hermes-build-deps --no-cache graphviz doxygen gcc make openssl-dev libspf2-dev cmake g++ sqlite-dev gettext-dev python3
  - cmake -B build_dir
  - cmake --build build_dir
- name: docker image build
  image: plugins/docker
  settings:
    tags:
      - latest-arm64
    repo: docker.gutierrezdequevedo.com/ps/hermes

